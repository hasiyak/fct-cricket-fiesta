<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCT Cricket Fiesta - Admin Login</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/../assets/css/style.css">

</head>
<body class="min-h-screen flex flex-col justify-between">
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 sm:h-20">


            <!-- Brand Logo & Title -->
            <a href="/" class="flex items-center space-x-3 cursor-pointer">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-emerald-600 to-amber-400 p-0.5 shadow-lg shadow-emerald-900/40 flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                    <i class="fa-solid fa-cricket-bat-ball text-xl text-amber-400"></i>
                    </div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-display font-extrabold text-lg sm:text-2xl tracking-wider text-white">FCT CRICKET FIESTA</h1>
                        <span class="bg-gradient-to-r from-amber-400 to-emerald-400 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-widest">2027</span>
                    </div>
                    <p class="text-xs text-slate-400 font-medium hidden sm:block">Annual Degree Cricket Championship</p>
                </div>
            </a>
        </div>
    </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto bg-slate-800 rounded-full flex items-center justify-center text-amber-400 text-2xl mb-4 shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Admin Login</h2>
            <p class="text-slate-400 text-sm">Enter your credentials to access the FCT Fiesta scoring dashboard.</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Username</label>
                <input type="text" id="username" placeholder="eg :- Hasindu" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
            </div>
        
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" placeholder="••••••••" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-950/50 transition mt-4">
            Login to Dashboard
            </button>
            <p id="error-msg" class="text-red-400 text-xs text-center mt-3 hidden">Incorrect username or password.</p>
        </form>
    </div>
  </main>




    <div id="footer"></div>
    <script src="/../js/main.js"></script>
</body>
</html>
